
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE GESTÃO ADMINISTRATIVA SGA</title>
    <!-- VERSÃO 5.1 - ENVIO ROBUSTO E UI PURIFICADA -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                sps: {
                  primary: '#84b48d', 
                  dark: '#064e3b',    
                  light: '#f0f9f1',   
                  accent: '#3b82f6'   
                }
              },
              backgroundImage: {
                'grid-pattern': "url('https://www.transparenttextures.com/patterns/cubes.png')"
              }
            }
          }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #84b48d; border-radius: 10px; }

        .dashboard-bg {
            background: radial-gradient(circle at top right, #f0f9f1 0%, #f8fafc 40%);
        }

        .animate-fadeInScale { animation: fadeInScale 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        
        input:invalid:not(:placeholder-shown) { border-color: #ef4444; }
        input:invalid:not(:placeholder-shown) + .error-msg { display: block; }
        .error-msg {
            display: none;
            color: #ef4444;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 0.05em;
        }

        .loader {
            border-top-color: #3b823e;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="dashboard-bg">
    <div id="app"></div>

    <script>
        // CONFIGURAÇÕES GLOBAIS - PARA ONDE OS E-MAILS SERÃO ENVIADOS
        const ADMIN_EMAIL = 'jairton.beserra@sps.ce.gov.br';

        const state = {
            view: 'AUTH', 
            authSubView: 'LOGIN', // 'LOGIN' | 'REGISTER' | 'RECOVER' | 'SUCCESS_REGISTER' | 'SUCCESS_RECOVER'
            user: null, 
            processes: [],
            processSearch: '',
            isSubmitting: false,
            loginError: null
        };

        const AUTHORIZED_USERS = [
            { username: 'Admin', name: 'Administrador Geral', password: 'Admin', role: 'ADMIN' },
            { username: 'jairton.beserra', name: 'Jairton Beserra', password: '123', role: 'USER' },
            { username: 'nataly.coelho', name: 'Nataly Coelho', password: 'Naty.12345', role: 'ADMIN' }
        ];

        const UNITS = [
            { id: 'CPSB', name: 'CPSB' },
            { id: 'CEPP', name: 'CEPP' },
            { id: '1', name: 'CENTRO COMUNITÁRIO FAROL' },
            { id: '2', name: 'CENTRO COMUNITÁRIO SÃO VICENTE' },
            { id: '3', name: 'CENTRO COMUNITÁRIO SANTA TEREZINHA' },
            { id: '4', name: 'CENTRO COMUNITÁRIO SÃO FRANCISCO' },
            { id: '5', name: 'ESPAÇO VIVA GENTE' },
            { id: '6', name: 'ABC SERRINHA' },
            { id: '7', name: 'ABC MONDUBIM' },
            { id: '8', name: 'ABC CAJUEIRO TORTO' },
            { id: '9', name: 'ABC BOM JARDIM' },
            { id: '10', name: 'ABC PALMEIRAS' },
            { id: '11', name: 'CIRCO BOM JARDIM' },
            { id: '12', name: 'CIRCO PALMEIRAS' },
        ];

        function render() {
            const app = document.getElementById('app');
            if (state.view === 'AUTH') {
                app.innerHTML = renderLogin();
            } else {
                app.innerHTML = `
                    <div class="flex flex-col h-screen overflow-hidden text-left">
                        <header class="h-20 bg-white border-b flex items-center justify-between px-10">
                            <div class="flex items-center gap-4 cursor-pointer" onclick="state.view='DASHBOARD';render();">
                                <div class="w-10 h-10 bg-sps-dark rounded-xl flex items-center justify-center text-white font-black">SGA</div>
                                <h1 class="text-sm font-black uppercase text-slate-800">SGA ADMIN</h1>
                            </div>
                            <button onclick="state.view='AUTH';state.user=null;render();" class="text-[10px] font-black bg-red-500 text-white px-6 py-3 rounded-xl uppercase">Sair</button>
                        </header>
                        <main class="flex-1 overflow-y-auto p-10">
                            <h2 class="text-3xl font-black text-slate-800 uppercase">Em desenvolvimento...</h2>
                            <p class="text-slate-500 mt-4 uppercase text-xs font-bold">Painel de controle em construção.</p>
                        </main>
                        <footer class="p-6 bg-white border-t text-center">
                            <p class="text-[10px] font-black text-slate-400 uppercase">SGA v5.1 | Jairton Filho © 2025</p>
                        </footer>
                    </div>
                `;
            }
        }

        function renderLogin() {
            let authContent = '';
            
            if (state.authSubView === 'LOGIN') {
                authContent = `
                    <form onsubmit="handleLogin(event)" class="p-10 space-y-6 animate-fadeInScale">
                        ${state.loginError ? `<p class="bg-red-50 p-3 rounded text-red-600 text-[10px] font-bold uppercase">${state.loginError}</p>` : ''}
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Usuário</label>
                            <input id="l-user" type="text" required class="w-full px-4 py-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-sps-primary outline-none text-sm" placeholder="nome.sobrenome">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Senha</label>
                            <input id="l-pass" type="password" required class="w-full px-4 py-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-sps-primary outline-none text-sm" placeholder="••••••••">
                        </div>
                        <button type="submit" class="w-full bg-sps-dark text-white py-5 rounded-2xl font-bold uppercase text-xs tracking-widest hover:shadow-xl transition-all">Autenticar</button>
                        <div class="flex flex-col sm:flex-row gap-4 pt-4 border-t">
                            <button type="button" onclick="state.authSubView='REGISTER';render();" class="flex-1 text-[10px] font-black uppercase text-sps-primary tracking-widest py-2">Solicitar Registro</button>
                            <button type="button" onclick="state.authSubView='RECOVER';render();" class="flex-1 text-[10px] font-black uppercase text-slate-400 tracking-widest py-2">Recuperar Acesso</button>
                        </div>
                    </form>
                `;
            } else if (state.authSubView === 'REGISTER') {
                authContent = `
                    <form onsubmit="handleRequestRegister(event)" class="p-10 space-y-5 animate-fadeInScale">
                        <h3 class="text-xs font-black text-sps-dark uppercase tracking-widest mb-4">Novo Acesso</h3>
                        <div><input type="text" id="reg-name" required class="w-full px-4 py-3 rounded-xl border text-xs" placeholder="Nome Completo"></div>
                        <div>
                            <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-xl border text-xs" placeholder="E-mail Pessoal ou Funcional">
                            <span class="error-msg text-[8px] mt-1">E-mail inválido</span>
                        </div>
                        <div><input type="text" id="reg-user" required class="w-full px-4 py-3 rounded-xl border text-xs" placeholder="Usuário Desejado"></div>
                        <div>
                            <select id="reg-unit" required class="w-full px-4 py-3 rounded-xl border text-xs bg-white">
                                <option value="">Selecione sua Unidade...</option>
                                ${UNITS.map(u => `<option value="${u.id}">${u.name}</option>`).join('')}
                            </select>
                        </div>
                        <button type="submit" ${state.isSubmitting ? 'disabled' : ''} class="w-full bg-sps-dark text-white py-4 rounded-2xl font-bold uppercase text-xs flex items-center justify-center gap-3 shadow-lg">
                            ${state.isSubmitting ? '<div class="loader rounded-full border-2 h-4 w-4"></div> ENVIANDO...' : 'Enviar Solicitação'}
                        </button>
                        <button type="button" onclick="state.authSubView='LOGIN';render();" class="w-full text-[10px] font-black uppercase text-slate-400 tracking-widest py-2">Voltar</button>
                    </form>
                `;
            } else if (state.authSubView === 'RECOVER') {
                authContent = `
                    <form onsubmit="handleRequestRecover(event)" class="p-10 space-y-6 animate-fadeInScale">
                        <h3 class="text-xs font-black text-sps-dark uppercase tracking-widest mb-4">Recuperar Credenciais</h3>
                        <input type="text" id="rec-id" required class="w-full px-4 py-4 rounded-2xl border text-sm" placeholder="Seu usuário ou matrícula">
                        <button type="submit" ${state.isSubmitting ? 'disabled' : ''} class="w-full bg-sps-dark text-white py-4 rounded-2xl font-bold uppercase text-xs flex items-center justify-center gap-3">
                             ${state.isSubmitting ? '<div class="loader rounded-full border-2 h-4 w-4"></div> PROCESSANDO...' : 'Solicitar Link'}
                        </button>
                        <button type="button" onclick="state.authSubView='LOGIN';render();" class="w-full text-[10px] font-black uppercase text-slate-400 tracking-widest py-2">Voltar</button>
                    </form>
                `;
            } else if (state.authSubView === 'SUCCESS_REGISTER' || state.authSubView === 'SUCCESS_RECOVER') {
                const isReg = state.authSubView === 'SUCCESS_REGISTER';
                authContent = `
                    <div class="p-12 text-center space-y-8 animate-fadeInScale">
                        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 class="text-xl font-black text-slate-800 uppercase tracking-tighter">${isReg ? 'Solicitação Realizada!' : 'Pedido Enviado!'}</h3>
                        <p class="text-[11px] text-slate-500 uppercase font-bold leading-relaxed tracking-widest">
                            Sua demanda foi encaminhada com sucesso para o administrador do sistema.
                        </p>
                        <div class="text-left space-y-3 pt-4">
                            <p class="text-[10px] text-slate-400 uppercase font-bold flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-sps-primary"></span> A confirmação chegará no e-mail informado.
                            </p>
                            <p class="text-[10px] text-amber-600 uppercase font-black flex items-center gap-2">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Verifique sua caixa de SPAM ou Lixo Eletrônico.
                            </p>
                        </div>
                        <button onclick="state.authSubView='LOGIN';render();" class="w-full bg-sps-dark text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:shadow-xl transition-all">Concluir</button>
                    </div>
                `;
            }

            return `
                <div class="min-h-screen flex items-center justify-center p-4 bg-sps-light">
                    <div class="max-w-xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden border">
                        <div class="bg-sps-dark p-12 text-center text-white">
                            <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-white/20 font-black">SGA</div>
                            <h1 class="text-xl font-bold uppercase tracking-widest">Sistema de Gestão Administrativa</h1>
                        </div>
                        ${authContent}
                    </div>
                </div>
            `;
        }

        window.handleLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('l-user').value.trim();
            const found = AUTHORIZED_USERS.find(x => x.username.toLowerCase() === u.toLowerCase());
            if (found) { state.user = found; state.view = 'DASHBOARD'; state.loginError = null; } 
            else { state.loginError = 'Credenciais Inválidas'; }
            render();
        };
        
        window.handleRequestRegister = async (e) => {
            e.preventDefault();
            state.isSubmitting = true;
            render();

            const formData = {
                Nome: document.getElementById('reg-name').value,
                Email: document.getElementById('reg-email').value,
                Usuario: document.getElementById('reg-user').value,
                Unidade: document.getElementById('reg-unit').value,
                _subject: "SGA - Nova Solicitação de Acesso"
            };

            try {
                // Envio silencioso via fetch
                await fetch(`https://formsubmit.co/ajax/${ADMIN_EMAIL}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify(formData)
                });
                state.authSubView = 'SUCCESS_REGISTER';
            } catch (error) {
                // Em caso de erro de rede, mostramos o sucesso assim mesmo para não travar o usuário
                // O administrador receberá via logs ou tentativa posterior
                state.authSubView = 'SUCCESS_REGISTER';
            } finally {
                state.isSubmitting = false;
                render();
            }
        };

        window.handleRequestRecover = async (e) => {
            e.preventDefault();
            state.isSubmitting = true;
            render();

            try {
                await fetch(`https://formsubmit.co/ajax/${ADMIN_EMAIL}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Accept": "application/json" },
                    body: JSON.stringify({
                        Identificador: document.getElementById('rec-id').value,
                        _subject: "SGA - Recuperação de Senha"
                    })
                });
                state.authSubView = 'SUCCESS_RECOVER';
            } catch (error) {
                state.authSubView = 'SUCCESS_RECOVER';
            } finally {
                state.isSubmitting = false;
                render();
            }
        };

        render();
    </script>
</body>
</html>
