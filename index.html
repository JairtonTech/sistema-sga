        const DEMAND_TYPES = ["Manutenção", "Administrativo", "RH", "Infraestrutura", "Equipamentos", "Outros"];
        const DEMAND_STATUS = [
            { id: 'PENDING', label: 'Pendente', color: 'text-red-600 bg-red-50 border-red-100' },
            { id: 'PROGRESS', label: 'Andamento', color: 'text-amber-600 bg-amber-50 border-amber-100' },

        ];

        function getTodayFormatted() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        function formatCurrency(val) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
        }

        function dateToTimestamp(dateStr) {
            if (!dateStr || typeof dateStr !== 'string') return 0;
            const parts = dateStr.split('/');
            if (parts.length === 3) return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
            if (parts.length === 2) return new Date(parts[1], parts[0] - 1, 1).getTime();
            return 0;
        }

        window.setLayoutScale = (scale) => {
            state.layoutScale = scale;
            document.body.classList.remove('scale-small', 'scale-normal', 'scale-large');
            document.body.classList.add(`scale-${scale}`);
            render();
        };

        function render() {
            const app = document.getElementById('app');
            if (state.view === 'AUTH') { app.innerHTML = renderLogin(); return; }

            app.innerHTML = `
                <div class="flex flex-col min-h-screen">
                    ${renderHeader()}
                    <main class="flex-1 overflow-y-auto px-4 py-6 md:px-10 md:py-10 relative z-10">
                        <div class="absolute inset-0 bg-grid-pattern opacity-[0.02] pointer-events-none"></div>
                        <div id="app-container" class="max-w-7xl mx-auto w-full transition-transform duration-300">
                            ${renderContent()}
                        </div>
                    </main>
                    ${renderFooter()}
                </div>
                ${state.isRegisteringProcess ? renderProcessModal() : ''}
                ${state.isRegisteringDemand ? renderDemandModal() : ''}
                ${state.isRegisteringUtility ? renderUtilityModal() : ''}
                ${state.viewingDemandDetailIndex !== null ? renderDemandDetailModal() : ''}
            `;
        }

        function renderHeader() {
            return `<header class="glass-header h-16 md:h-20 flex items-center justify-between px-4 md:px-10 sticky top-0 z-[100]">
                <div class="flex items-center gap-3 md:gap-5 cursor-pointer" onclick="state.view='DASHBOARD';render();">
                    <div class="w-8 h-8 md:w-10 md:h-10 bg-sps-dark rounded-lg md:rounded-xl flex items-center justify-center text-white shadow-md">
                        <svg class="w-4 h-4 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-width="2"/></svg>
                    </div>
                    <h1 class="text-[9px] md:text-xs font-black text-slate-800 uppercase tracking-tighter">Gestão Administrativa</h1>
                </div>
                
                <div class="flex items-center gap-4">
                    <div class="hidden md:flex items-center bg-white/50 p-1 rounded-xl border border-slate-200 gap-1">
                        <button onclick="setLayoutScale('small')" class="accessibility-btn ${state.layoutScale === 'small' ? 'active' : ''}">A-</button>
                        <button onclick="setLayoutScale('normal')" class="accessibility-btn ${state.layoutScale === 'normal' ? 'active' : ''}">A</button>
                        <button onclick="setLayoutScale('large')" class="accessibility-btn ${state.layoutScale === 'large' ? 'active' : ''}">A+</button>
                    </div>

                    <div class="flex items-center gap-3 md:gap-8">

                            <p class="text-[10px] font-black text-slate-900 uppercase leading-none">Olá, <span class="text-sps-primary">${state.user.name.split(' ')[0]}</span></p>
                            <span class="text-[8px] font-black uppercase text-slate-400">${state.user.role}</span>
                        </div>
                        <button onclick="state.view='AUTH';state.user=null;render();" class="text-[8px] md:text-[9px] font-black text-white bg-red-500 px-4 py-2 md:px-6 md:py-3 rounded-lg md:rounded-xl uppercase tracking-widest shadow-sm hover:bg-red-600 transition-colors">Sair</button>
                    </div>

        }

        function renderFooter() {

        function renderLogin() {
            return `<div class="min-h-screen flex items-center justify-center p-4 bg-sps-light">

                        <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-8 border border-white/20 text-white">
                             <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-width="2"/></svg>
                        </div>
                        <h1 class="text-[11px] md:text-sm font-black uppercase tracking-[0.2em] text-white leading-relaxed">
                            Sistema Unificado de Gestão Administrativa
                        </h1>
                    </div>
                    <form onsubmit="handleLogin(event)" class="p-8 md:p-12 space-y-6">
                        ${state.loginError ? `<p class="bg-red-50 p-3 rounded text-red-600 text-[9px] font-bold uppercase">${state.loginError}</p>` : ''}
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Usuário</label>
                            <input id="l-user" type="text" required class="w-full px-4 py-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-sps-primary/20 transition-all font-medium text-slate-700" placeholder="nome.sobrenome">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Senha</label>
                            <input id="l-pass" type="password" required class="w-full px-4 py-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-sps-primary/20 transition-all font-medium text-slate-700" placeholder="••••••••">
                        </div>
                        <button type="submit" class="w-full bg-sps-dark text-white py-5 rounded-xl font-bold uppercase text-[10px] tracking-[0.2em] active:scale-95 transition-transform shadow-lg">Autenticar</button>
                    </form>
                </div>
            </div>`;
        }

        function renderDashboardHub() {
            const isAdmin = state.user.role === 'ADMIN';
            return `<div class="space-y-12 py-4 md:py-6 fade-in">
                <div class="welcome-hero rounded-[40px] p-8 md:p-16 shadow-2xl text-center md:text-left">
                    <div class="max-w-3xl">

                        <p class="text-white/60 text-xs md:text-lg font-medium leading-relaxed max-w-2xl mb-8 uppercase tracking-wide italic">

                    ${isAdmin ? `

                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke-width="2"/></svg>
                        </div>
                        <div>
                            <h3 class="text-xl font-black text-slate-800 uppercase tracking-tight mb-2 group-hover:text-sps-dark">Relação Pessoal</h3>
                            <p class="text-[9px] text-slate-400 uppercase font-black leading-relaxed">Gestão de colaboradores das 12 unidades operacionais.</p>
                        </div>
                    </button>` : ''}

                    <button onclick="state.view='PROCESSES';render();" class="nav-card p-8 rounded-[32px] bg-white text-left flex flex-col justify-between group min-h-[250px]">
                        <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mb-10 group-hover:bg-amber-500 group-hover:text-white transition-all shadow-inner">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-width="2"/></svg>
                        </div>
                        <div>
                            <h3 class="text-xl font-black text-slate-800 uppercase tracking-tight mb-2 group-hover:text-amber-600">Processos Suite</h3>

                        </div>
                    </button>

                    <button onclick="state.view='DEMANDS';render();" class="nav-card p-8 rounded-[32px] bg-white text-left flex flex-col justify-between group min-h-[250px]">

        function renderUtilities() {
            const records = state.utilityRecords;
            const totalCost = records.reduce((acc, r) => acc + parseFloat(r.cost || 0), 0);
            const enelTotal = records.filter(r => r.type === 'ENEL').reduce((acc, r) => acc + parseFloat(r.cost || 0), 0);
            const cageceTotal = records.filter(r => r.type === 'CAGECE').reduce((acc, r) => acc + parseFloat(r.cost || 0), 0);
            
            const filtered = records.filter(r => {
                const typeMatch = state.utilityTypeFilter === 'ALL' || r.type === state.utilityTypeFilter;
                const unitMatch = state.utilityUnitFilter === 'ALL' || r.unitId === state.utilityUnitFilter;
                return typeMatch && unitMatch;
            }).sort((a, b) => dateToTimestamp(b.date) - dateToTimestamp(a.date));

            return `<div class="space-y-6 fade-in">

                    </div>
                    <div class="bg-amber-50 p-6 rounded-2xl border border-amber-100 shadow-sm">

                    </div>

                </div>

                         <div class="flex flex-col sm:flex-row gap-2">
                            <select onchange="state.utilityTypeFilter=this.value;render();" class="px-3 py-2 rounded-xl border border-slate-200 text-[9px] font-black uppercase outline-none">
                                <option value="ALL">Todos os Tipos</option>
                                <option value="ENEL" ${state.utilityTypeFilter === 'ENEL' ? 'selected' : ''}>ENEL (Energia)</option>
                                <option value="CAGECE" ${state.utilityTypeFilter === 'CAGECE' ? 'selected' : ''}>CAGECE (Água)</option>
                            </select>

        window.handleSaveProc = (e) => { e.preventDefault(); const d = { data: document.getElementById('p-date').value, nup: document.getElementById('p-nup').value, descricao: document.getElementById('p-desc').value }; if (state.editingIndex !== null) state.processes[state.editingIndex] = d; else state.processes.unshift(d); state.isRegisteringProcess = false; render(); };
        window.handleStartCreateDemand = () => { state.editingDemandIndex = null; state.isRegisteringDemand = true; render(); };
        window.handleStartEditDemand = (idx) => { state.editingDemandIndex = idx; state.isRegisteringDemand = true; render(); };
        window.handleViewDemandDetail = (idx) => { state.viewingDemandDetailIndex = idx; render(); };
        window.handleSaveDemand = (e) => { e.preventDefault(); const d = { data: document.getElementById('d-date').value, unidade: document.getElementById('d-unit').value, tipo: document.getElementById('d-type').value, descricao: document.getElementById('d-desc').value, status: document.getElementById('d-status').value }; if (state.editingDemandIndex !== null) state.demands[state.editingDemandIndex] = d; else state.demands.unshift(d); state.isRegisteringDemand = false; render(); };
        window.handleLogin = (e) => { e.preventDefault(); const u = document.getElementById('l-user').value.trim(); const found = AUTHORIZED_USERS.find(x => x.username.toLowerCase() === u.toLowerCase()); if (found) { state.user = found; state.view = 'DASHBOARD'; state.loginError = null; } else { state.loginError = 'Erro de acesso'; } render(); };

        render();
    </script>
</body>
</html>
