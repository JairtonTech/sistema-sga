<body>
    <div id="app"></div>

    <script>
        const state = {
            view: 'AUTH', 
            user: null, 
            selectedUnit: null,
            loginError: null,
            processes: [],
            processSearch: '',
            processSortDir: 'desc',
            isRegisteringProcess: false,
            editingIndex: null,
            selectedIndices: [] 
        };

        const AUTHORIZED_USERS = [
            { username: 'Admin', password: 'Admin', role: 'ADMIN' },
            { username: 'jairton.beserra', password: '123', role: 'USER' }
        ];

        const UNITS = [
            { id: '1', name: 'CENTRO COMUNITÁRIO Farol' },
            { id: '2', name: 'CENTRO COMUNITÁRIO São Vicente' },
            { id: '3', name: 'CENTRO COMUNITÁRIO Santa Terezinha' },
            { id: '4', name: 'CENTRO COMUNITÁRIO São Francisco' },
            { id: '5', name: 'Espaço Viva Gente' },
            { id: '6', name: 'ABC Serrinha' },
            { id: '7', name: 'ABC Mondubim' },
            { id: '8', name: 'ABC Cajueiro Torto' },
            { id: '9', name: 'ABC Bom Jardim' },
            { id: '10', name: 'ABC Palmeiras' },
            { id: '11', name: 'Circo Bom Jardim' },
            { id: '12', name: 'Circo Palmeiras' },
        ];

        // --- UTILITÁRIOS ---
        function getTodayFormatted() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        function formatDate(date) {
            if (!(date instanceof Date)) return date;
            const dd = String(date.getDate()).padStart(2, '0');
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const yyyy = date.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        }

        function maskDate(v) {
            v = v.replace(/\D/g, "");
            if (v.length > 8) v = v.substring(0, 8);
            if (v.length > 2) v = v.substring(0, 2) + "/" + v.substring(2);
            if (v.length > 5) v = v.substring(0, 5) + "/" + v.substring(5);
            return v;
        }

        function maskNUP(v) {
            v = v.replace(/\D/g, "");
            if (v.length > 17) v = v.substring(0, 17);
            let r = "";
            if (v.length > 0) r += v.substring(0, 5);
            if (v.length > 5) r += "." + v.substring(5, 11);
            if (v.length > 11) r += "/" + v.substring(11, 15);
            if (v.length > 15) r += "-" + v.substring(15, 17);
            return r;
        }

        function handleDateInput(e) {
            e.target.value = maskDate(e.target.value);
        }

        function handleNUPInput(e) {
            let val = e.target.value;
            if (!val.startsWith("47001")) {
                val = "47001" + val.replace(/\D/g, "").substring(0, 12);
            }
            e.target.value = maskNUP(val);
        }

        function syncHiddenDate(e) {
            const date = e.target.value; 
            if (date) {
                const [y, m, d] = date.split('-');
                document.getElementById('p-date').value = `${d}/${m}/${y}`;
            }
        }

        function highlight(text, query) {
            if (!query || !text) return text;
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            return text.toString().replace(regex, '<mark class="search-highlight">$1</mark>');
        }

        // --- MULTISELEÇÃO ---
        window.handleToggleSelect = (originalIndex) => {
            const idx = Number(originalIndex);
            const pos = state.selectedIndices.indexOf(idx);
            if (pos > -1) {
                state.selectedIndices.splice(pos, 1);
            } else {
                state.selectedIndices.push(idx);
            }
            render();
        };

        window.handleToggleAll = (filteredIndicesStr) => {
            const filteredIndices = filteredIndicesStr.split(',').map(Number);
            const allOfFilteredSelected = filteredIndices.length > 0 && filteredIndices.every(idx => state.selectedIndices.includes(idx));
            
            if (allOfFilteredSelected) {
                // Remove os filtrados da seleção
                state.selectedIndices = state.selectedIndices.filter(idx => !filteredIndices.includes(idx));
            } else {
                // Adiciona os que ainda não estão
                filteredIndices.forEach(idx => {
                    if (!state.selectedIndices.includes(idx)) state.selectedIndices.push(idx);
                });
            }
            render();
        };

        window.handleBulkDelete = () => {
            if (state.selectedIndices.length === 0) return;
            const count = state.selectedIndices.length;
            if (confirm(`Atenção: Você está prestes a excluir ${count} processo(s). Deseja continuar?`)) {
                // Filtramos a base original removendo quem está na lista de selecionados
                state.processes = state.processes.filter((_, idx) => !state.selectedIndices.includes(idx));
                // Limpamos a seleção
                state.selectedIndices = [];
                render();
            }
        };

        // --- IMPORTAÇÃO INTELIGENTE ---
        window.handleImportExcel = (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const fileName = file.name.toLowerCase();
            const reader = new FileReader();

            reader.onload = (e) => {
                let workbook;
                try {
                    if (fileName.endsWith('.html') || fileName.endsWith('.xhtml')) {
                        const content = new TextDecoder().decode(e.target.result);
                        workbook = XLSX.read(content, { type: 'string' });
                    } else {
                        const data = new Uint8Array(e.target.result);
                        workbook = XLSX.read(data, { type: 'array', cellDates: true });
                    }

                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" }); // defval garante que colunas vazias existam

                    if (jsonData.length === 0) {
                        alert("O arquivo parece estar vazio.");
                        return;
                    }

                    let importedCount = 0;
                    jsonData.forEach(row => {
                        let nup = "", data = getTodayFormatted(), descricao = "";

                        Object.keys(row).forEach(key => {
                            const normalizedKey = key.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                            
                            if (normalizedKey.includes('nup') || normalizedKey.includes('processo')) {
                                nup = row[key];
                            }
                            else if (normalizedKey.includes('data') || normalizedKey.includes('date')) {
                                data = (row[key] instanceof Date) ? formatDate(row[key]) : row[key];
                            }
                            // Busca por Descrição (Ajuste fino: agora captura qualquer campo que pareça ser o texto descritivo)
                            else if (
                                normalizedKey === 'descricao' || 
                                normalizedKey === 'assunto' || 
                                normalizedKey.includes('descri') || 
                                normalizedKey.includes('detalhe') || 
                                normalizedKey.includes('objeto') || 
                                normalizedKey.includes('obs') ||
                                normalizedKey.includes('resumo') ||
                                normalizedKey.includes('texto')
                            ) {
                                // Se já achou uma descrição e essa nova chave for apenas 'obs', ignora. 
                                // Caso contrário, atribui.
                                if (!descricao || normalizedKey.includes('descri')) {
                                    descricao = row[key];
                                }
                            }
                        });

                        state.processes.unshift({
                            data: data ? data.toString() : getTodayFormatted(),
                            nup: nup ? maskNUP(nup.toString()) : "",
                            descricao: descricao ? descricao.toString() : ""
                        });
                        importedCount++;
                    });

                    alert(`${importedCount} processos importados com sucesso de ${fileName}!`);
                    state.selectedIndices = [];
                    render();
                } catch (err) {
                    console.error(err);
                    alert("Erro ao ler arquivo. Verifique se o formato é válido.");
                }
            };

            reader.readAsArrayBuffer(file);
            event.target.value = "";
        };

        function render() {
            // Salva estado do foco atual para o campo de busca
            const activeElementId = document.activeElement ? document.activeElement.id : null;
            const selectionStart = document.activeElement ? document.activeElement.selectionStart : null;
            const selectionEnd = document.activeElement ? document.activeElement.selectionEnd : null;

            const app = document.getElementById('app');
            if (state.view === 'AUTH') {
                app.innerHTML = renderLogin();
                return;
            }
            app.innerHTML = `
                <div class="flex h-screen bg-slate-50 overflow-hidden text-left">
                    <div class="flex-1 flex flex-col overflow-hidden">
                        ${renderHeader()}
                        <main class="flex-1 overflow-y-auto">
                            <div class="h-full fade-in">
                                ${renderContent()}
                            </div>
                        </main>
                    </div>
                </div>
                ${state.isRegisteringProcess ? renderProcessModal() : ''}
            `;
            
            // Restaura foco e cursor se necessário
            if (activeElementId) {
                const element = document.getElementById(activeElementId);
                if (element) {
                    element.focus();
                    if (selectionStart !== null && (element.type === 'text' || element.type === 'search')) {
                        element.setSelectionRange(selectionStart, selectionEnd);
                    }
                }
            }

            if (state.isRegisteringProcess) {
                const dateField = document.getElementById('p-date');
                const nupField = document.getElementById('p-nup');
                const descField = document.getElementById('p-desc');

                if (state.editingIndex !== null) {
                    const proc = state.processes[state.editingIndex];
                    if (dateField) dateField.value = proc.data;
                    if (nupField) nupField.value = proc.nup;
                    if (descField) descField.value = proc.descricao;
                } else {
                    if (dateField && !dateField.value) dateField.value = getTodayFormatted();
                    if (nupField && !nupField.value) nupField.value = "47001.";
                }
            }
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-sps-light p-4 fade-in text-left">
                    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
                        <div class="bg-sps-dark p-10 text-center text-white min-h-[160px] flex items-center justify-center">
                            <h1 class="text-xl font-bold uppercase tracking-tight text-center">SISTEMA DE GESTÃO ADMINISTRATIVA CEPP</h1>
                        </div>
                        <form onsubmit="handleLogin(event)" class="p-10 space-y-6">
                            ${state.loginError ? `<p class="bg-red-50 p-3 rounded text-red-600 text-[10px] font-bold uppercase">${state.loginError}</p>` : ''}
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Usuário</label>
                                <input id="l-user" type="text" required class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-sps-primary outline-none" placeholder="nome.sobrenome">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-2 uppercase">Senha</label>
                                <input id="l-pass" type="password" required class="w-full px-4 py-3 rounded-xl border focus:ring-2 focus:ring-sps-primary outline-none" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-sps-dark text-white py-4 rounded-xl font-bold uppercase text-xs tracking-widest hover:opacity-90 transition-all shadow-lg active:scale-95">ACESSAR PAINEL</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderHeader() {
            return `
                <header class="bg-white border-b h-20 flex items-center justify-between px-8 shadow-sm z-10 text-left">
                    <div class="flex items-center gap-4 cursor-pointer" onclick="state.view='DASHBOARD';state.selectedIndices=[];render();">
                        <div class="w-10 h-10 bg-sps-dark rounded flex items-center justify-center text-white font-black text-xs uppercase">SPS</div>
                        <div>
                            <h2 class="text-[9px] font-bold text-sps-dark uppercase tracking-widest leading-none mb-1">SPS | Governo do Estado do Ceará</h2>
                            <h1 class="text-sm font-bold text-slate-800 uppercase tracking-tight leading-tight">SISTEMA DE GESTÃO ADMINISTRATIVA CEPP</h1>
                        </div>
                    </div>
                    <div class="flex items-center gap-6">
                        <div class="text-right hidden sm:block">
                            <p class="text-[10px] font-bold text-slate-900 uppercase leading-none mb-1">${state.user.username}</p>
                            <span class="text-[8px] font-bold uppercase tracking-widest ${state.user.role === 'ADMIN' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700'} px-2 py-0.5 rounded">${state.user.role}</span>
                        </div>
                        <button onclick="state.view='AUTH';state.user=null;state.selectedIndices=[];render();" class="text-[10px] font-bold text-red-600 uppercase border border-red-100 px-4 py-2 rounded-xl hover:bg-red-50 transition-all">Sair</button>
                    </div>
                </header>
            `;
        }

        function renderContent() {
            switch(state.view) {
                case 'DASHBOARD': return renderDashboardHub();
                case 'PERSONNEL': return renderPersonnel();
                case 'PROCESSES': return renderProcesses();
                case 'UNIT_DETAIL': return renderUnitDetail();
                default: return '';
            }
        }

        function renderDashboardHub() {
            const isAdmin = state.user.role === 'ADMIN';
            return `
                <div class="h-full w-full flex flex-col items-center justify-center bg-slate-50/50 py-12 text-center">
                    <div class="max-w-5xl w-full text-center space-y-12 fade-in px-6">
                        <div class="space-y-4">
                            <h1 class="text-5xl md:text-7xl font-black uppercase text-slate-800 tracking-tighter leading-none text-center">Painel de Controle</h1>
                            <p class="text-lg md:text-2xl text-slate-400 font-medium tracking-wide uppercase text-center">Bem-vindo ao Sistema Administrativo.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-8 max-w-4xl mx-auto">
                            ${isAdmin ? `
                            <button onclick="state.view='PERSONNEL';render();" class="nav-card bg-white p-10 rounded-3xl border border-slate-200 text-left flex flex-col justify-between group h-64">
                                <div class="w-16 h-16 bg-sps-light text-sps-dark rounded-2xl flex items-center justify-center mb-6 shadow-inner group-hover:bg-sps-dark group-hover:text-white transition-all">
                                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                </div>
                                <div><h3 class="text-xl font-black text-slate-800 uppercase tracking-tight mb-2">Relação do Pessoal</h3><p class="text-[11px] text-slate-500 uppercase font-bold tracking-widest">Gestão das 12 unidades operacionais</p></div>
                            </button>
                            ` : ''}
                            <button onclick="state.view='PROCESSES';render();" class="nav-card bg-white p-10 rounded-3xl border border-slate-200 text-left flex flex-col justify-between group h-64">
                                <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mb-6 shadow-inner group-hover:bg-amber-500 group-hover:text-white transition-all">
                                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                </div>
                                <div><h3 class="text-xl font-black text-slate-800 uppercase tracking-tight mb-2">Processos Suite</h3><p class="text-[11px] text-slate-500 uppercase font-bold tracking-widest">Acompanhamento de fluxos e NUPS</p></div>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPersonnel() {
            return `
                <div class="p-8 space-y-6 text-left">
                    <div class="flex items-center gap-4">
                        <button onclick="state.view='DASHBOARD';render();" class="p-2 hover:bg-slate-200 rounded-full transition-colors">←</button>
                        <h1 class="text-2xl font-bold uppercase tracking-tight text-slate-900">Relação do Pessoal</h1>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${UNITS.map(u => `
                            <div onclick="state.selectedUnit=UNITS.find(x=>x.id==='${u.id}');state.view='UNIT_DETAIL';render();" class="bg-white p-6 rounded-2xl border border-slate-200 hover:border-sps-primary cursor-pointer transition-all shadow-sm hover:shadow-lg group text-left">
                                <h3 class="font-bold text-slate-800 group-hover:text-sps-dark text-[11px] uppercase">${u.name}</h3>
                                <div class="mt-6 flex items-center justify-between"><span class="text-[9px] font-bold uppercase tracking-widest text-sps-dark">Gerenciar →</span></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProcesses() {
            const isAdmin = state.user.role === 'ADMIN';
            
            const items = state.processes.map((p, idx) => ({ ...p, originalIndex: idx }));
            const filteredItems = items.filter(p => 
                p.nup.toLowerCase().includes(state.processSearch.toLowerCase()) || 
                p.descricao.toLowerCase().includes(state.processSearch.toLowerCase())
            );

            filteredItems.sort((a, b) => {
                const [da, ma, ya] = a.data.split('/');
                const [db, mb, yb] = b.data.split('/');
                const dateA = new Date(ya, ma - 1, da).getTime();
                const dateB = new Date(yb, mb - 1, db).getTime();
                return state.processSortDir === 'asc' ? dateA - dateB : dateB - dateA;
            });

            const filteredIndices = filteredItems.map(item => item.originalIndex);
            const allOfFilteredSelected = filteredIndices.length > 0 && filteredIndices.every(idx => state.selectedIndices.includes(idx));
            const hasSelection = state.selectedIndices.length > 0;
            const sortLabel = state.processSortDir === 'asc' ? 'CRESCENTE ↑' : 'DECRESCENTE ↓';

            return `
                <div class="p-8 space-y-6 text-left">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="flex items-center gap-4 text-left">
                            <button onclick="state.view='DASHBOARD';state.selectedIndices=[];render();" class="p-2 hover:bg-slate-200 rounded-full transition-colors">←</button>
                            <h1 class="text-2xl font-bold uppercase tracking-tight text-slate-900">
                                Processos Suite
                                <span class="ml-3 bg-slate-100 text-slate-400 px-3 py-1 rounded-full text-[10px] font-black tracking-widest">TOTAL: ${state.processes.length}</span>
                            </h1>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="text" id="proc-search-input" placeholder="Buscar..." oninput="state.processSearch=this.value;render();" value="${state.processSearch}" class="px-4 py-3 rounded-xl border border-slate-300 text-xs outline-none focus:ring-2 focus:ring-sps-primary w-48 lg:w-64 shadow-sm">
                            ${isAdmin ? `
                                <input type="file" id="excel-import" class="hidden" accept=".xlsx, .xls, .ods, .html, .xhtml" onchange="handleImportExcel(event)">
                                <button onclick="document.getElementById('excel-import').click()" class="bg-emerald-600 text-white px-5 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-lg active:scale-95 flex items-center gap-2 transition-all">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2a2 2 0 00-2-2H5a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                    Importar
                                </button>
                                ${hasSelection ? `
                                    <button onclick="handleBulkDelete()" class="bg-red-400 text-white px-5 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-lg active:scale-95 flex items-center gap-2 transition-all">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                        Excluir (${state.selectedIndices.length})
                                    </button>
                                ` : ''}
                                <button onclick="state.editingIndex=null;state.isRegisteringProcess=true;render();" class="bg-sps-primary text-white px-5 py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest shadow-lg active:scale-95 transition-all">Cadastrar</button>
                            ` : ''}
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <table class="w-full text-left text-[11px] border-collapse">
                            <thead class="bg-slate-50 font-bold uppercase border-b-2 border-slate-100 sticky top-0">
                                <tr>
                                    ${isAdmin ? `
                                        <th class="px-6 py-5 w-12 text-center">
                                            <input type="checkbox" ${allOfFilteredSelected ? 'checked' : ''} onchange="handleToggleAll('${filteredIndices.join(',')}')">
                                        </th>
                                    ` : ''}
                                    <th class="px-6 py-5 cursor-pointer w-32" onclick="state.processSortDir=state.processSortDir==='asc'?'desc':'asc';render();">Data <span class="ml-1 text-sps-dark">${sortLabel}</span></th>
                                    <th class="px-6 py-5 w-64 border-l">NUP</th>
                                    <th class="px-6 py-5 border-l">Descrição</th>
                                    ${isAdmin ? `<th class="px-6 py-5 border-l w-24 text-center text-xs">Ações</th>` : ''}
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-50">
                                ${filteredItems.length > 0 ? filteredItems.map((p) => {
                                    const isSelected = state.selectedIndices.includes(p.originalIndex);
                                    return `
                                    <tr class="hover:bg-slate-50 transition-colors ${isSelected ? 'selected-row' : ''}">
                                        ${isAdmin ? `
                                            <td class="px-6 py-4 text-center">
                                                <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="handleToggleSelect(${p.originalIndex})">
                                            </td>
                                        ` : ''}
                                        <td class="px-6 py-4 text-slate-500 font-medium">${p.data}</td>
                                        <td class="px-6 py-4 font-mono text-sps-dark font-bold tracking-tight">${highlight(p.nup || '---', state.processSearch)}</td>
                                        <td class="px-6 py-4 text-slate-800 uppercase leading-tight font-medium max-w-md break-words">${highlight(p.descricao || '', state.processSearch) || '<span class="text-slate-200 italic">sem descrição</span>'}</td>
                                        ${isAdmin ? `
                                            <td class="px-6 py-4 text-center border-l">
                                                <button onclick="handleStartEdit(${p.originalIndex})" class="p-1.5 text-blue-400 hover:bg-blue-50 rounded transition-colors" title="Editar">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                                </button>
                                            </td>
                                        ` : ''}
                                    </tr>`}).join('') : `<tr><td colspan="${isAdmin ? 5 : 3}" class="px-6 py-20 text-center text-slate-300 italic text-xs uppercase font-bold tracking-widest">Nenhum processo encontrado.</td></tr>`}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderProcessModal() {
            const isEditing = state.editingIndex !== null;
            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop fade-in text-left">
                    <div class="bg-white w-full max-w-md rounded-[20px] shadow-2xl overflow-hidden animate-fadeInScale">
                        <div class="bg-sps-primary py-5 text-white text-center">
                            <h3 class="text-[13px] font-bold uppercase tracking-widest">${isEditing ? 'Editar Registro Suite' : 'Novo Registro Suite'}</h3>
                        </div>
                        
                        <form onsubmit="handleSaveProc(event)" class="p-8 space-y-5 text-left bg-slate-50/30">
                            <div class="relative">
                                <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1.5 ml-1">Data</label>
                                <div class="relative group">
                                    <input id="p-date" type="text" placeholder="DD/MM/AAAA" required 
                                        oninput="handleDateInput(event)"
                                        maxlength="10"
                                        class="w-full bg-white p-3.5 border border-slate-200 rounded-xl text-[12px] outline-none focus:ring-2 focus:ring-blue-400 transition-all">
                                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none opacity-40">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2-2v12a2 2 0 002 2z"></path></svg>
                                    </div>
                                    <input type="date" class="absolute inset-0 opacity-0 cursor-pointer" onchange="syncHiddenDate(event)">
                                </div>
                            </div>

                            <div>
                                <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1.5 ml-1">NUP</label>
                                <input id="p-nup" type="text" placeholder="47001.XXXXXX/XXXX-XX" 
                                    oninput="handleNUPInput(event)"
                                    class="w-full bg-white p-3.5 border border-slate-200 rounded-xl text-[12px] font-mono outline-none focus:ring-2 focus:ring-blue-400 transition-all">
                            </div>

                            <div>
                                <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1.5 ml-1">Descrição</label>
                                <textarea id="p-desc" placeholder="Descreva os detalhes..." required 
                                    class="w-full bg-white p-3.5 border border-slate-200 rounded-xl text-[12px] uppercase outline-none focus:ring-2 focus:ring-blue-400 transition-all resize-none" rows="3"></textarea>
                            </div>

                            <div class="flex gap-4 pt-4">
                                <button type="button" onclick="state.isRegisteringProcess=false;state.editingIndex=null;render();" 
                                    class="flex-1 py-4 bg-white border border-slate-100 rounded-xl font-bold text-[10px] uppercase text-slate-400 hover:bg-slate-50 transition-colors">Cancelar</button>
                                <button type="submit" 
                                    class="flex-1 py-4 bg-sps-primary text-white rounded-xl font-bold text-[10px] uppercase shadow-md hover:opacity-90 active:scale-[0.98] transition-all">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderUnitDetail() {
            const u = state.selectedUnit;
            return `<div class="p-8 text-left"><button onclick="state.view='PERSONNEL';render();" class="text-xs font-bold text-sps-dark uppercase mb-4">← Voltar</button><h1 class="text-2xl font-bold uppercase">${u.name}</h1><p class="mt-8 text-slate-400 italic text-xs uppercase">Base de dados limpa.</p></div>`;
        }

        window.handleLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('l-user').value.trim();
            const found = AUTHORIZED_USERS.find(x => x.username.toLowerCase() === u.toLowerCase());
            if (found) { state.user = found; state.view = 'DASHBOARD'; state.loginError = null; } 
            else { state.loginError = 'Falha na Autenticação'; }
            render();
        };

        window.handleStartEdit = (idx) => {
            state.editingIndex = Number(idx);
            state.isRegisteringProcess = true;
            render();
        }

        window.handleSaveProc = (e) => {
            e.preventDefault();
            const data = { 
                data: document.getElementById('p-date').value, 
                nup: document.getElementById('p-nup').value, 
                descricao: document.getElementById('p-desc').value 
            };

            if (state.editingIndex !== null) {
                state.processes[state.editingIndex] = data;
            } else {
                state.processes.unshift(data);
            }
            
            state.isRegisteringProcess = false;
            state.editingIndex = null;
            state.selectedIndices = [];
            render();
        };

        render();
    </script>
</body>
</html>
