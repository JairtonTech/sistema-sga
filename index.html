
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE GESTÃO ADMINISTRATIVA SGA</title>
    <!-- VERSÃO 3.5 - DASHBOARD PREMIUM EXPERIENCE -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                sps: {
                  primary: '#84b48d', 
                  dark: '#064e3b',    
                  light: '#f0f9f1',   
                  accent: '#3b82f6'   
                }
              },
              backgroundImage: {
                'grid-pattern': "url('https://www.transparenttextures.com/patterns/cubes.png')"
              }
            }
          }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #84b48d; border-radius: 10px; }

        .dashboard-bg {
            background: radial-gradient(circle at top right, #f0f9f1 0%, #f8fafc 40%);
        }

        .nav-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }
        .nav-card:hover {
            transform: translateY(-12px);
            background: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
        }

        .status-pill {
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .text-gradient {
            background: linear-gradient(135deg, #064e3b 0%, #3b823e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="dashboard-bg">
    <div id="app"></div>

    <script>
        const state = {
            view: 'AUTH', 
            user: null, 
            processes: [],
            processSearch: '',
            processSortDir: 'desc',
            isRegisteringProcess: false,
            editingIndex: null,
            selectedIndices: [] 
        };

        const AUTHORIZED_USERS = [
            { username: 'Admin', name: 'Administrador Geral', password: 'Admin', role: 'ADMIN' },
            { username: 'jairton.beserra', name: 'Jairton Beserra', password: '123', role: 'USER' }
        ];

        const UNITS = [
            { id: '1', name: 'CENTRO COMUNITÁRIO Farol' },
            { id: '2', name: 'CENTRO COMUNITÁRIO São Vicente' },
            { id: '3', name: 'CENTRO COMUNITÁRIO Santa Terezinha' },
            { id: '4', name: 'CENTRO COMUNITÁRIO São Francisco' },
            { id: '5', name: 'Espaço Viva Gente' },
            { id: '6', name: 'ABC Serrinha' },
            { id: '7', name: 'ABC Mondubim' },
            { id: '8', name: 'ABC Cajueiro Torto' },
            { id: '9', name: 'ABC Bom Jardim' },
            { id: '10', name: 'ABC Palmeiras' },
            { id: '11', name: 'Circo Bom Jardim' },
            { id: '12', name: 'Circo Palmeiras' },
        ];

        function render() {
            const app = document.getElementById('app');
            if (state.view === 'AUTH') {
                app.innerHTML = renderLogin();
                return;
            }
            app.innerHTML = `
                <div class="flex h-screen overflow-hidden text-left">
                    <div class="flex-1 flex flex-col overflow-hidden">
                        ${renderHeader()}
                        <main class="flex-1 overflow-y-auto relative">
                            <!-- Overlay Pattern -->
                            <div class="absolute inset-0 bg-grid-pattern opacity-[0.03] pointer-events-none"></div>
                            <div class="h-full relative z-10">${renderContent()}</div>
                        </main>
                    </div>
                </div>
                ${state.isRegisteringProcess ? renderProcessModal() : ''}
            `;
        }

        function renderLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-sps-light p-4 fade-in">
                    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
                        <div class="bg-sps-dark p-12 text-center text-white flex flex-col items-center justify-center">
                            <div class="w-20 h-20 bg-white/10 rounded-2xl flex items-center justify-center text-white font-black text-3xl mb-6 border border-white/20">SGA</div>
                            <h1 class="text-xl font-bold uppercase tracking-widest">Sistema de Gestão</h1>
                            <p class="text-[10px] opacity-60 uppercase font-black tracking-tighter mt-1">Administrativa</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="p-10 space-y-6">
                            ${state.loginError ? `<p class="bg-red-50 p-3 rounded text-red-600 text-[10px] font-bold uppercase">${state.loginError}</p>` : ''}
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Usuário Institucional</label>
                                <input id="l-user" type="text" required class="w-full px-4 py-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-sps-primary outline-none transition-all" placeholder="nome.sobrenome">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Senha</label>
                                <input id="l-pass" type="password" required class="w-full px-4 py-4 rounded-2xl border border-slate-200 focus:ring-2 focus:ring-sps-primary outline-none transition-all" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full bg-sps-dark text-white py-5 rounded-2xl font-bold uppercase text-xs tracking-widest hover:shadow-xl active:scale-95 transition-all">Autenticar</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function renderHeader() {
            const isAdmin = state.user.role === 'ADMIN';
            return `
                <header class="glass-header h-20 flex items-center justify-between px-10 z-50">
                    <div class="flex items-center gap-5 cursor-pointer group" onclick="state.view='DASHBOARD';render();">
                        <div class="w-10 h-10 bg-sps-dark rounded-xl flex items-center justify-center text-white font-black text-xs transition-transform group-hover:scale-105">SGA</div>
                        <div class="hidden md:block">
                            <h1 class="text-sm font-black text-slate-800 uppercase tracking-tight leading-none mb-0.5">Gestão Administrativa</h1>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Plataforma Unificada</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-8">
                        <div class="text-right flex items-center gap-4">
                            <div class="hidden sm:block">
                                <p class="text-[10px] font-black text-slate-900 uppercase leading-none mb-1">Olá, <span class="text-sps-primary">${state.user.name.split(' ')[0]}</span></p>
                                <div class="flex items-center justify-end gap-2">
                                    <span class="text-[8px] font-black uppercase px-2 py-0.5 rounded bg-slate-100 text-slate-500">${state.user.role}</span>
                                </div>
                            </div>
                            <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center font-bold text-sps-dark border border-white shadow-sm">${state.user.name.charAt(0)}</div>
                        </div>
                        <button onclick="state.view='AUTH';state.user=null;render();" class="text-[9px] font-black text-white bg-red-500 px-6 py-3 rounded-xl hover:bg-red-600 shadow-lg active:scale-95 transition-all uppercase tracking-widest">Sair</button>
                    </div>
                </header>
            `;
        }

        function renderContent() {
            switch(state.view) {
                case 'DASHBOARD': return renderDashboardHub();
                case 'PERSONNEL': return renderPersonnel();
                case 'PROCESSES': return renderProcesses();
                default: return '';
            }
        }

        function renderDashboardHub() {
            const isAdmin = state.user.role === 'ADMIN';
            return `
                <div class="h-full w-full flex flex-col items-center justify-center py-10 px-6">
                    <div class="max-w-4xl w-full flex flex-col items-center gap-12">
                        
                        <!-- Header Dashboard -->
                        <div class="text-center space-y-4 fade-in">
                            <h1 class="text-5xl md:text-6xl font-black uppercase text-gradient tracking-tighter leading-none mb-2">Painel de Controle</h1>
                            <div class="flex flex-col gap-1 items-center">
                                <h2 class="text-lg md:text-xl text-slate-700 font-bold uppercase tracking-tight">Bem-vindo ao Sistema de Gestão Administrativa</h2>
                                <p class="text-[11px] text-slate-400 font-bold uppercase tracking-[0.2em] opacity-80">Escolha uma das opções abaixo para prosseguir</p>
                            </div>
                        </div>

                        <!-- Status Bar -->
                        <div class="flex flex-wrap justify-center gap-3 fade-in stagger-1">
                            <div class="status-pill bg-emerald-50 text-emerald-600 border border-emerald-100">
                                <div class="status-dot"></div> Módulo RH Online
                            </div>
                            <div class="status-pill bg-amber-50 text-amber-600 border border-amber-100">
                                <div class="status-dot"></div> Suíte Sincronizado
                            </div>
                            <div class="status-pill bg-blue-50 text-blue-600 border border-blue-100">
                                <div class="status-dot"></div> Servidor Estável
                            </div>
                        </div>

                        <!-- Action Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl pt-4 fade-in stagger-2">
                            ${isAdmin ? `
                            <button onclick="state.view='PERSONNEL';render();" class="nav-card p-10 rounded-[32px] border border-slate-200/50 text-left flex flex-col justify-between group h-72 shadow-xl shadow-slate-200/50">
                                <div class="w-16 h-16 bg-sps-light text-sps-dark rounded-2xl flex items-center justify-center mb-6 shadow-inner group-hover:bg-sps-dark group-hover:text-white transition-all duration-500">
                                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                                </div>
                                <div>
                                    <div class="flex items-center gap-2 mb-2">
                                        <h3 class="text-2xl font-black text-slate-800 uppercase tracking-tight">Relação do Pessoal</h3>
                                        <span class="text-[8px] bg-sps-dark text-white px-2 py-0.5 rounded-full font-bold uppercase">Acesso Total</span>
                                    </div>
                                    <p class="text-[11px] text-slate-500 uppercase font-bold tracking-widest leading-relaxed">Gestão centralizada das 12 unidades operacionais e fluxo de colaboradores.</p>
                                </div>
                            </button>
                            ` : ''}
                            <button onclick="state.view='PROCESSES';render();" class="nav-card p-10 rounded-[32px] border border-slate-200/50 text-left flex flex-col justify-between group h-72 shadow-xl shadow-slate-200/50">
                                <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mb-6 shadow-inner group-hover:bg-amber-500 group-hover:text-white transition-all duration-500">
                                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                </div>
                                <div>
                                    <h3 class="text-2xl font-black text-slate-800 uppercase tracking-tight mb-2">Processos Suite</h3>
                                    <p class="text-[11px] text-slate-500 uppercase font-bold tracking-widest leading-relaxed">Acompanhamento em tempo real de fluxos documentais, NUPS e protocolos externos.</p>
                                </div>
                            </button>
                        </div>

                        <!-- Decoration Line -->
                        <div class="w-full flex items-center gap-6 opacity-10 fade-in stagger-3">
                            <div class="flex-1 h-[1px] bg-slate-400"></div>
                            <div class="w-2 h-2 rounded-full bg-slate-400"></div>
                            <div class="flex-1 h-[1px] bg-slate-400"></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPersonnel() {
            return `
                <div class="p-10 space-y-8 fade-in">
                    <div class="flex items-center gap-6">
                        <button onclick="state.view='DASHBOARD';render();" class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-sm border border-slate-100 hover:bg-slate-50 transition-all">←</button>
                        <div>
                            <h1 class="text-3xl font-black uppercase text-slate-800 tracking-tight">Relação do Pessoal</h1>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Gestão de Unidades</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${UNITS.map(u => `
                            <div class="bg-white p-8 rounded-3xl border border-slate-100 hover:border-sps-primary transition-all shadow-sm group cursor-pointer">
                                <h3 class="font-bold text-slate-700 group-hover:text-sps-dark text-xs uppercase leading-tight h-10 flex items-center">${u.name}</h3>
                                <div class="mt-8 flex items-center justify-between">
                                    <span class="text-[9px] font-black uppercase text-sps-primary tracking-widest">Acessar</span>
                                    <div class="w-6 h-6 rounded-lg bg-slate-50 flex items-center justify-center text-slate-400 group-hover:bg-sps-primary group-hover:text-white transition-all">→</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderProcesses() {
            const canEdit = state.user.role === 'ADMIN';
            const items = state.processes.map((p, idx) => ({ ...p, originalIndex: idx }));
            const filteredItems = items.filter(p => 
                p.nup.toLowerCase().includes(state.processSearch.toLowerCase()) || 
                p.descricao.toLowerCase().includes(state.processSearch.toLowerCase())
            );

            return `
                <div class="p-10 space-y-8 fade-in">
                    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                        <div class="flex items-center gap-6">
                            <button onclick="state.view='DASHBOARD';render();" class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-sm border border-slate-100 hover:bg-slate-50 transition-all">←</button>
                            <div>
                                <h1 class="text-3xl font-black uppercase text-slate-800 tracking-tight">Processos Suite</h1>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Total: ${state.processes.length} Registros</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="text" id="proc-search-input" placeholder="Filtrar processos..." oninput="state.processSearch=this.value;render();" value="${state.processSearch}" class="px-6 py-4 rounded-2xl border border-slate-200 text-xs outline-none focus:ring-2 focus:ring-sps-primary w-full md:w-80 shadow-sm">
                            ${canEdit ? `
                                <button onclick="state.editingIndex=null;state.isRegisteringProcess=true;render();" class="bg-sps-dark text-white px-8 py-4 rounded-2xl text-[10px] font-bold uppercase tracking-widest shadow-lg hover:shadow-emerald-900/20 active:scale-95 transition-all">Novo Registro</button>
                            ` : ''}
                        </div>
                    </div>
                    <div class="bg-white rounded-[32px] border border-slate-200/50 shadow-xl overflow-hidden">
                        <table class="w-full text-left text-[11px]">
                            <thead class="bg-slate-50/80 font-black uppercase border-b border-slate-100">
                                <tr>
                                    <th class="px-8 py-6 w-32">Data</th>
                                    <th class="px-8 py-6 w-64">NUP</th>
                                    <th class="px-8 py-6">Descrição do Fluxo</th>
                                    ${canEdit ? `<th class="px-8 py-6 w-24 text-center">Ações</th>` : ''}
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-50">
                                ${filteredItems.map((p) => `
                                    <tr class="hover:bg-slate-50/50 transition-colors">
                                        <td class="px-8 py-5 text-slate-400 font-bold">${p.data}</td>
                                        <td class="px-8 py-5 font-mono text-sps-dark font-black">${p.nup || '---'}</td>
                                        <td class="px-8 py-5 text-slate-800 uppercase leading-relaxed font-bold">${p.descricao || ''}</td>
                                        ${canEdit ? `
                                            <td class="px-8 py-5 text-center">
                                                <button onclick="handleStartEdit(${p.originalIndex})" class="w-8 h-8 flex items-center justify-center text-blue-400 hover:bg-blue-50 rounded-lg transition-all">
                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                                </button>
                                            </td>
                                        ` : ''}
                                    </tr>`).join('')}
                                ${filteredItems.length === 0 ? `<tr><td colspan="4" class="px-8 py-20 text-center text-slate-300 italic text-[10px] uppercase font-black tracking-[0.2em]">Nenhum registro encontrado.</td></tr>` : ''}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.handleLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('l-user').value.trim();
            const found = AUTHORIZED_USERS.find(x => x.username.toLowerCase() === u.toLowerCase());
            if (found) { state.user = found; state.view = 'DASHBOARD'; state.loginError = null; } 
            else { state.loginError = 'Falha na Autenticação'; }
            render();
        };

        render();
    </script>
</body>
</html>
